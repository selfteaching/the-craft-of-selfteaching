<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页放大镜</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #667eea;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .emoji {
      font-size: 24px;
    }

    .control-group {
      margin-bottom: 20px;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #555;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #toggleBtn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    #toggleBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    #toggleBtn.active {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .slider-container {
      margin-top: 8px;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #e0e0e0;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      cursor: pointer;
      border: none;
    }

    .value-display {
      display: inline-block;
      float: right;
      font-weight: 600;
      color: #667eea;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      margin-top: 15px;
      font-weight: 500;
    }

    .status.active {
      background: #d4edda;
      color: #155724;
    }

    .status.inactive {
      background: #f8d7da;
      color: #721c24;
    }

    .shortcut {
      margin-top: 15px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      color: #666;
    }

    .shortcut code {
      background: #e9ecef;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-weight: 600;
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span class="emoji">🔍</span>
      网页放大镜
    </h1>

    <div class="control-group">
      <div class="button-group">
        <button id="toggleBtn">启动放大镜</button>
      </div>
    </div>

    <div class="control-group">
      <label>
        放大倍数
        <span class="value-display" id="zoomValue">2x</span>
      </label>
      <div class="slider-container">
        <input type="range" id="zoomSlider" min="1.5" max="5" step="0.5" value="2">
      </div>
    </div>

    <div class="control-group">
      <label>
        放大镜大小
        <span class="value-display" id="sizeValue">200px</span>
      </label>
      <div class="slider-container">
        <input type="range" id="sizeSlider" min="100" max="400" step="50" value="200">
      </div>
    </div>

    <div id="status" class="status inactive">
      状态：未激活
    </div>

    <div class="shortcut">
      快捷键: <code>Alt + M</code> 切换放大镜
    </div>
  </div>

  <script src="js/popup.js"></script>
</body>
</html>
